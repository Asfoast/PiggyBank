<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PiggyBank - Gestion de Budget & Abonnements</title>
    <meta name="description" content="PiggyBank : Suivi de budget et abonnements récurrents synchronisé avec Google Sheets et Google Drive." />
    <meta property="og:title" content="PiggyBank - Gestion de Budget & Abonnements" />
    <meta property="og:description" content="PiggyBank : Suivi de budget et abonnements récurrents synchronisé avec Google Sheets et Google Drive." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PiggyBank" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #334155;">
        <div style="width: 42px; height: 42px; border: 3.5px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;"></div>
        <p style="font-size: 13px; font-weight: 600; color: #475569; letter-spacing: -0.01em;">Chargement de PiggyBank...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('Service Worker registration skipped/failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
